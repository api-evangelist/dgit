name: DGIT
description: 'DGIT Systems is a Melbourne, Australia telecommunications software vendor best known for
  Telflow, an order-management and service-orchestration (BSS/OSS) platform used by communications service
  providers to design, quote, order and fulfil connectivity products. DGIT was surfaced as a portfolio
  company of Sierra Ventures. As of this enrichment pass the company has no independent public web presence:
  its product domains dgitsystems.com and telflow.com both 308-redirect to csgi.com, indicating DGIT has
  been absorbed into CSG Systems International, and the domain listed by the Sierra Ventures portfolio
  page (dgit.us) is an Afternic/GoDaddy for-sale parking page rather than a company site. No developer
  portal, API documentation, OpenAPI specification, SDK or package surface could be located.'
